<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>FitLab - Iniciar Sesion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body style="background-color: #121212; color: white; padding: 20px;">

    <div class="container text-center">
        <h1 style="color: #ff5722;">FitLab</h1>
        
        <div class="bg-dark p-2 mb-4">
            <a href="index.html" class="text-white" style="margin: 10px;">Inicio</a> |
            <a href="carrito.html" class="text-white" style="margin: 10px;">Carrito (<b id="cant-carrito">0</b>)</a> |
            <a href="login.html" class="text-danger" style="margin: 10px;">Iniciar Sesion</a> |
            <a href="registro.html" class="text-white" style="margin: 10px;">Registrarse</a> |
            <a href="admin.html" class="text-white" style="margin: 10px;">Administracion</a>
        </div>
    </div>

    <div style="width: 360px; margin: 20px auto; background-color: #1e1e1e; padding: 25px; border-radius: 5px;">
        <h3 style="color: #ff5722;" class="text-center mb-3">Iniciar Sesion</h3>
        
        <form onsubmit="return false;">
            <div class="mb-3">
                <label class="form-label text-white">Correo electronico:</label>
                <input type="text" id="correoLogin" class="form-control" placeholder="ejemplo@duocuc.cl">
            </div>
            <div class="mb-3">
                <label class="form-label text-white">Contraseña:</label>
                <input type="password" id="claveLogin" class="form-control" placeholder="Entre 4 y 10 caracteres">
            </div>
            <button type="button" class="btn btn-warning w-100 mt-2" onclick="iniciarSesion()">Ingresar</button>
        </form>
        <div id="mensajeLogin" class="d-none"></div>

        <div class="text-center mt-3">
            <small>¿No tienes cuenta? <a href="registro.html" class="text-warning">Registrate aqui</a></small>
        </div>
    </div>

    <script src="funciones.js"></script>
</body>
</html>
