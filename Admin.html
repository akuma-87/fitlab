<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>FitLab - Administracion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body style="background-color: #121212; color: white; padding: 20px;">

    <div class="container">
        <h1 class="text-center" style="color: #ff5722;">FitLab - Panel de Administracion</h1>
        
        <div class="bg-dark p-2 mb-4 text-center">
            <a href="index.html" class="text-white" style="margin: 10px;">Inicio</a> |
            <a href="carrito.html" class="text-white" style="margin: 10px;">Carrito (<b id="cant-carrito">0</b>)</a> |
            <a href="login.html" class="text-white" style="margin: 10px;">Iniciar Sesion</a> |
            <a href="admin.html" class="text-danger" style="margin: 10px;">Administracion</a>
        </div>

        //formulario para agregar producto
        <div class="bg-dark p-3 rounded mb-4" style="max-width: 500px; margin: 0 auto;">
            <h4 style="color: #ff5722;" class="text-center mb-3">Agregar Nuevo Producto</h4>
            <form onsubmit="agregarProductoNuevo(event)">
                <div class="mb-3">
                    <label>Nombre del Producto:</label>
                    <input type="text" id="nuevoNombreProd" class="form-control" placeholder="Ej: BCAA 300g" required>
                </div>
                <div class="mb-3">
                    <label>Stock Inicial:</label>
                    <input type="number" id="nuevoStockProd" class="form-control" placeholder="Ej: 10" min="0" required>
                </div>
                <button type="submit" class="btn btn-warning w-100">Registrar Producto</button>
            </form>
        </div>

        <!-- TABLA DINAMICA DE PRODUCTOS -->
        <h4 style="color: #ff5722;">Control de Inventario y Stock</h4>
        <div class="table-responsive">
            <table class="table table-dark table-bordered mt-2" id="tablaStock">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Stock Actual</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Se carga dinamicamente con JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="funciones.js"></script>
</body>
</html>
