<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>FitLab - Carrito de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body style="background-color: #121212; color: white; padding: 20px;">

    <div class="container">
        <h1 class="text-center" style="color: #ff5722;">FitLab - Carrito</h1>
        
        <div class="bg-dark p-2 mb-4 text-center">
            <a href="index.html" class="text-white" style="margin: 10px;">Inicio</a> |
            <a href="carrito.html" class="text-danger" style="margin: 10px;">Carrito (<b id="cant-carrito">0</b>)</a> |
            <a href="login.html" class="text-white" style="margin: 10px;">Iniciar Sesion</a> |
            <a href="admin.html" class="text-white" style="margin: 10px;">Administracion</a>
        </div>

        <div class="table-responsive">
            <table class="table table-dark table-striped mt-3">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Cantidad</th>
                        <th>Subtotal</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-carrito">
                </tbody>
            </table>
        </div>

        <div class="text-end mt-4">
            <h4>Total a pagar: <span id="total-pagar" style="color: #ff5722;">$0</span></h4>
            <button class="btn btn-success btn-lg mt-2" onclick="alert('¡Gracias por tu compra!')">Finalizar Compra</button>
        </div>
    </div>

    <script src="funciones.js"></script>
</body>
</html>
